<svg width="300" height="460" viewBox="0 0 300 460" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Shirley Temple glass illustration</title>
<desc>Flat outline-style tall glass of Shirley Temple, red-orange liquid, ice cubes, bubbles, two cherries on top, striped straw</desc>

<defs>
  <linearGradient id="red-fill" x1="0%" y1="100%" x2="0%" y2="0%">
    <stop offset="0%" stop-color="#D02030" opacity="0.85"/>
    <stop offset="40%" stop-color="#E84050" opacity="0.75"/>
    <stop offset="100%" stop-color="#F87888" opacity="0.55"/>
  </linearGradient>
  <clipPath id="glass-clip">
    <polygon points="82,90 218,90 202,370 98,370"/>
  </clipPath>
</defs>

<!-- liquid fill -->
<g clip-path="url(#glass-clip)">
  <polygon points="82,90 218,90 202,370 98,370" fill="url(#red-fill)"/>
  <circle cx="108" cy="310" r="4" fill="white" opacity="0.28"/>
  <circle cx="124" cy="280" r="3" fill="white" opacity="0.24"/>
  <circle cx="148" cy="330" r="5" fill="white" opacity="0.22"/>
  <circle cx="170" cy="295" r="3.5" fill="white" opacity="0.26"/>
  <circle cx="190" cy="318" r="3" fill="white" opacity="0.22"/>
  <circle cx="116" cy="250" r="3.5" fill="white" opacity="0.20"/>
  <circle cx="182" cy="258" r="4" fill="white" opacity="0.22"/>
  <circle cx="138" cy="200" r="3" fill="white" opacity="0.18"/>
  <circle cx="165" cy="220" r="2.5" fill="white" opacity="0.18"/>
  <circle cx="104" cy="190" r="2.5" fill="white" opacity="0.16"/>
  <circle cx="196" cy="180" r="3" fill="white" opacity="0.16"/>
  <circle cx="128" cy="150" r="2.5" fill="white" opacity="0.20"/>
  <circle cx="172" cy="160" r="2" fill="white" opacity="0.18"/>
  <path d="M86,96 Q84,180 86,300" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.16"/>
</g>

<!-- ice cubes -->
<rect x="94" y="102" width="46" height="46" rx="6" fill="white" opacity="0.30" stroke="#CC2040" stroke-width="2" transform="rotate(-9,117,125)"/>
<line x1="98" y1="112" x2="110" y2="140" stroke="#CC2040" stroke-width="1" opacity="0.45" transform="rotate(-9,117,125)"/>
<line x1="114" y1="106" x2="104" y2="140" stroke="#CC2040" stroke-width="1" opacity="0.45" transform="rotate(-9,117,125)"/>

<rect x="150" y="96" width="42" height="42" rx="6" fill="white" opacity="0.28" stroke="#CC2040" stroke-width="2" transform="rotate(7,171,117)"/>
<line x1="156" y1="104" x2="164" y2="130" stroke="#CC2040" stroke-width="1" opacity="0.45" transform="rotate(7,171,117)"/>
<line x1="168" y1="100" x2="158" y2="130" stroke="#CC2040" stroke-width="1" opacity="0.45" transform="rotate(7,171,117)"/>

<rect x="100" y="172" width="38" height="38" rx="6" fill="white" opacity="0.25" stroke="#CC2040" stroke-width="2" transform="rotate(-7,119,191)"/>
<line x1="104" y1="180" x2="114" y2="202" stroke="#CC2040" stroke-width="1" opacity="0.4" transform="rotate(-7,119,191)"/>

<rect x="158" y="164" width="36" height="36" rx="6" fill="white" opacity="0.22" stroke="#CC2040" stroke-width="2" transform="rotate(10,176,182)"/>
<line x1="162" y1="172" x2="170" y2="192" stroke="#CC2040" stroke-width="1" opacity="0.4" transform="rotate(10,176,182)"/>

<rect x="106" y="238" width="34" height="34" rx="6" fill="white" opacity="0.20" stroke="#CC2040" stroke-width="1.5" transform="rotate(-5,123,255)"/>
<rect x="162" y="230" width="32" height="32" rx="6" fill="white" opacity="0.18" stroke="#CC2040" stroke-width="1.5" transform="rotate(8,178,246)"/>

<!-- glass outline -->
<polygon points="82,90 218,90 202,370 98,370" fill="none" stroke="#CC2040" stroke-width="3"/>
<line x1="82" y1="90" x2="218" y2="90" stroke="#CC2040" stroke-width="3"/>
<rect x="98" y="370" width="104" height="12" rx="4" fill="none" stroke="#CC2040" stroke-width="2.5"/>

<!-- cherry 1 -->
<circle cx="128" cy="94" r="12" fill="#CC1020" stroke="#880010" stroke-width="1.5"/>
<circle cx="125" cy="91" r="3.5" fill="#FF4050" opacity="0.5"/>
<path d="M128,82 Q126,66 136,56" fill="none" stroke="#3A7020" stroke-width="2" stroke-linecap="round"/>

<!-- cherry 2 -->
<circle cx="158" cy="86" r="12" fill="#CC1020" stroke="#880010" stroke-width="1.5"/>
<circle cx="155" cy="83" r="3.5" fill="#FF4050" opacity="0.5"/>
<path d="M158,74 Q162,58 150,46" fill="none" stroke="#3A7020" stroke-width="2" stroke-linecap="round"/>

<!-- striped straw -->
<rect x="178" y="28" width="7" height="270" rx="3" fill="#F8F0F0" stroke="#CC2040" stroke-width="1"/>
<rect x="178" y="28" width="7" height="18" rx="2" fill="#CC2040"/>
<rect x="178" y="64" width="7" height="18" fill="#CC2040"/>
<rect x="178" y="100" width="7" height="18" fill="#CC2040"/>
<rect x="178" y="136" width="7" height="18" fill="#CC2040"/>
<rect x="178" y="172" width="7" height="18" fill="#CC2040"/>
<rect x="178" y="208" width="7" height="18" fill="#CC2040"/>
<rect x="178" y="244" width="7" height="18" fill="#CC2040"/>

<text x="150" y="416" font-family="Georgia, serif" font-size="13" fill="#5f5e5a" text-anchor="middle">shirley temple</text>

</svg>
