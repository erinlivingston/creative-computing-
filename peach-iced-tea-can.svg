<svg width="300" height="500" viewBox="0 0 300 500" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Peach iced tea tall boy can — gold and red</title>
<desc>Flat illustrative tall boy can, gold upper half, red lower half, peach illustration, Rest in Peach label</desc>

<defs>
  <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#A87200"/>
    <stop offset="30%" stop-color="#D4980A"/>
    <stop offset="52%" stop-color="#F0C030"/>
    <stop offset="70%" stop-color="#D4980A"/>
    <stop offset="100%" stop-color="#A87200"/>
  </linearGradient>
  <linearGradient id="red-grad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#7A1010"/>
    <stop offset="30%" stop-color="#AA1C1C"/>
    <stop offset="52%" stop-color="#C42020"/>
    <stop offset="70%" stop-color="#AA1C1C"/>
    <stop offset="100%" stop-color="#7A1010"/>
  </linearGradient>
  <linearGradient id="silver-top" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#909090"/>
    <stop offset="40%" stop-color="#E0E0E0"/>
    <stop offset="60%" stop-color="#E8E8E8"/>
    <stop offset="100%" stop-color="#909090"/>
  </linearGradient>
  <clipPath id="can-clip">
    <path d="M72,36 L228,36 L228,462 Q228,480 150,480 Q72,480 72,462 Z"/>
  </clipPath>
</defs>

<!-- can body clipped to shape with rounded bottom -->
<g clip-path="url(#can-clip)">
  <rect x="72" y="36" width="156" height="444" fill="url(#gold-grad)"/>
  <rect x="72" y="228" width="156" height="252" fill="url(#red-grad)"/>
  <rect x="72" y="36" width="18" height="444" fill="white" opacity="0.10"/>
  <rect x="210" y="36" width="18" height="444" fill="black" opacity="0.10"/>
</g>

<!-- can outline with rounded bottom -->
<path d="M72,36 L228,36 L228,462 Q228,480 150,480 Q72,480 72,462 Z" fill="none" stroke="#8B6500" stroke-width="1.5"/>

<!-- dividing gold lines -->
<rect x="72" y="226" width="156" height="3" fill="#DAA520"/>
<rect x="72" y="232" width="156" height="1.5" fill="#DAA520" opacity="0.7"/>

<!-- top neck taper -->
<polygon points="72,36 88,16 212,16 228,36" fill="url(#gold-grad)"/>
<polygon points="72,36 88,16 212,16 228,36" fill="none" stroke="#A87200" stroke-width="1"/>

<!-- top lid ellipse -->
<ellipse cx="150" cy="16" rx="62" ry="10" fill="url(#silver-top)" stroke="#888" stroke-width="1.2"/>
<ellipse cx="150" cy="16" rx="48" ry="6" fill="#D4D4D4" stroke="#AAA" stroke-width="0.5"/>

<!-- text in gold zone -->
<text x="150" y="105" font-family="Georgia, serif" font-size="40" font-weight="bold" fill="#8B1A1A" text-anchor="middle" letter-spacing="0.5">Rest in</text>
<text x="150" y="153" font-family="Georgia, serif" font-size="40" font-weight="bold" fill="#8B1A1A" text-anchor="middle" letter-spacing="0.5">Peach</text>
<text x="150" y="178" font-family="Georgia, serif" font-size="11" fill="#8B1A1A" text-anchor="middle" letter-spacing="3">PEACH ICED TEA</text>

<!-- gold rule lines -->
<line x1="86" y1="188" x2="214" y2="188" stroke="#8B1A1A" stroke-width="1"/>
<line x1="86" y1="216" x2="214" y2="216" stroke="#8B1A1A" stroke-width="1"/>

<!-- peach illustration -->
<g transform="translate(150,340)">
  <ellipse cx="0" cy="0" rx="52" ry="56" fill="#FFAA55" opacity="0.92"/>
  <ellipse cx="-12" cy="-8" rx="30" ry="34" fill="#FFCC88" opacity="0.55"/>
  <path d="M0,-56 Q7,-22 5,0 Q3,22 0,56" fill="none" stroke="#D06820" stroke-width="2" opacity="0.65"/>
  <ellipse cx="16" cy="-52" rx="16" ry="7" fill="#4A7C30" transform="rotate(-28,16,-52)"/>
  <line x1="2" y1="-56" x2="16" y2="-52" stroke="#3A6020" stroke-width="1.5"/>
</g>

<!-- murder your thirst -->
<text x="150" y="460" font-family="Georgia, serif" font-size="8" fill="#DAA520" text-anchor="middle" letter-spacing="2.5">MURDER YOUR THIRST</text>

</svg>
