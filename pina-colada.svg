<svg width="300" height="440" viewBox="0 0 300 440" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Piña colada illustration</title>
<desc>Simple flat outline hurricane glass with white slushy fill, pineapple wedge, cherry, and yellow straw</desc>

<defs>
  <linearGradient id="colada-fill" x1="0%" y1="100%" x2="0%" y2="0%">
    <stop offset="0%" stop-color="#F0E8B0" opacity="0.85"/>
    <stop offset="40%" stop-color="#F8F4D8" opacity="0.80"/>
    <stop offset="100%" stop-color="#FFFFFF" opacity="0.90"/>
  </linearGradient>
  <clipPath id="glass-clip">
    <path d="M96,90 L204,90 L204,300 Q204,338 150,346 Q96,338 96,300 Z"/>
  </clipPath>
</defs>

<!-- liquid fill -->
<g clip-path="url(#glass-clip)">
  <path d="M96,90 L204,90 L204,300 Q204,338 150,346 Q96,338 96,300 Z" fill="url(#colada-fill)"/>
  <ellipse cx="120" cy="268" rx="24" ry="10" fill="white" opacity="0.55" transform="rotate(-8,120,268)"/>
  <ellipse cx="172" cy="250" rx="20" ry="9" fill="white" opacity="0.48" transform="rotate(6,172,250)"/>
  <ellipse cx="108" cy="220" rx="18" ry="8" fill="white" opacity="0.44" transform="rotate(-5,108,220)"/>
  <ellipse cx="182" cy="205" rx="16" ry="7" fill="white" opacity="0.42" transform="rotate(9,182,205)"/>
  <ellipse cx="130" cy="175" rx="22" ry="8" fill="white" opacity="0.45" transform="rotate(-7,130,175)"/>
  <ellipse cx="168" cy="298" rx="18" ry="7" fill="white" opacity="0.40" transform="rotate(4,168,298)"/>
  <ellipse cx="112" cy="310" rx="14" ry="6" fill="white" opacity="0.38" transform="rotate(-9,112,310)"/>
  <ellipse cx="136" cy="104" rx="28" ry="10" fill="white" opacity="0.75"/>
  <ellipse cx="162" cy="96" rx="20" ry="8" fill="white" opacity="0.65"/>
  <ellipse cx="116" cy="98" rx="14" ry="6" fill="white" opacity="0.60"/>
  <path d="M102,96 Q100,170 102,270" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.22"/>
</g>

<!-- glass outline -->
<path d="M96,90 L204,90 L204,300 Q204,338 150,346 Q96,338 96,300 Z" fill="none" stroke="#C8900A" stroke-width="3"/>
<line x1="96" y1="90" x2="204" y2="90" stroke="#C8900A" stroke-width="3"/>

<!-- stem -->
<rect x="144" y="346" width="12" height="38" rx="4" fill="#F5D020" stroke="#C8900A" stroke-width="2.5"/>

<!-- base -->
<ellipse cx="150" cy="384" rx="42" ry="9" fill="#F5D020" stroke="#C8900A" stroke-width="2.5"/>
<ellipse cx="150" cy="384" rx="33" ry="5.5" fill="#F8E050" opacity="0.5"/>

<!-- straw -->
<rect x="170" y="28" width="7" height="290" rx="3" fill="#F5D020" stroke="#C8900A" stroke-width="1.5"/>

<!-- pineapple wedge -->
<g transform="translate(190,88)">
  <path d="M-10,2 L26,-44 Q38,-28 34,-6 Z" fill="#F5C020" stroke="#C8900A" stroke-width="1.8"/>
  <path d="M-5,0 L22,-36 Q30,-22 28,-6 Z" fill="#F8D840" opacity="0.55"/>
  <path d="M26,-44 Q38,-28 34,-6" fill="none" stroke="#5A9020" stroke-width="5" stroke-linecap="round"/>
  <line x1="-10" y1="2" x2="26" y2="-44" stroke="#C8900A" stroke-width="0.8" opacity="0.4"/>
  <line x1="-10" y1="2" x2="34" y2="-6" stroke="#C8900A" stroke-width="0.8" opacity="0.4"/>
  <line x1="-10" y1="2" x2="32" y2="-28" stroke="#C8900A" stroke-width="0.8" opacity="0.4"/>
</g>

<!-- cherry -->
<circle cx="200" cy="42" r="10" fill="#CC1020" stroke="#880010" stroke-width="1.5"/>
<circle cx="197" cy="39" r="3" fill="#FF4050" opacity="0.5"/>
<path d="M200,32 Q204,18 194,10" fill="none" stroke="#3A7020" stroke-width="1.8" stroke-linecap="round"/>

<text x="150" y="422" font-family="Georgia, serif" font-size="13" fill="#5f5e5a" text-anchor="middle">piña colada</text>

</svg>
