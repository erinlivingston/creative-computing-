<!DOCTYPE html>
<html lang="en">
<head>

  <title>Erin's Fridge</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Georgia, serif;
      background: #f5f3ee;
      color: #2c2c2a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: normal;
      letter-spacing: 0.04em;
      margin-bottom: 0.4rem;
      color: #5f5e5a;
    }

    .intro {
      font-size: 0.9rem;
      color: #888780;
      margin-bottom: 2.5rem;
      max-width: 320px;
      text-align: center;
      line-height: 1.7;
    }

    .fridge-link {
      display: block;
      text-decoration: none;
      cursor: pointer;
    }

    .fridge-link .fridge-svg {
      width: min(300px, 92vw);
      height: auto;
      display: block;
    }

    .fridge-link:hover svg .door-glass {
      fill: rgba(200,230,215,0.14);
    }

    .hint {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: #b4b2a9;
      text-align: center;
      letter-spacing: 0.03em;
    }
  </style>
</head>
