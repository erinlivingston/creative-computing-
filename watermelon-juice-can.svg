<svg width="300" height="420" viewBox="0 0 300 420" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Trader Joe's Sparkling Watermelon Juice can illustration</title>
<desc>Flat illustrative slim can, bright lime green, Trader Joe's sparkling watermelon juice label with watermelon slice</desc>

<defs>
  <linearGradient id="green-grad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#6AAD2A"/>
    <stop offset="30%" stop-color="#8FCC44"/>
    <stop offset="52%" stop-color="#A8E050"/>
    <stop offset="72%" stop-color="#8FCC44"/>
    <stop offset="100%" stop-color="#6AAD2A"/>
  </linearGradient>
  <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#909090"/>
    <stop offset="45%" stop-color="#E8E8E8"/>
    <stop offset="100%" stop-color="#909090"/>
  </linearGradient>
  <clipPath id="wm-clip">
    <path d="M94,36 L206,36 L206,368 Q206,382 150,382 Q94,382 94,368 Z"/>
  </clipPath>
</defs>

<!-- can body clipped -->
<g clip-path="url(#wm-clip)">
  <rect x="94" y="36" width="112" height="346" fill="url(#green-grad)"/>
  <!-- highlight left -->
  <rect x="94" y="36" width="13" height="346" fill="white" opacity="0.10"/>
  <!-- shadow right -->
  <rect x="193" y="36" width="13" height="346" fill="black" opacity="0.08"/>
  <!-- bubbles -->
  <circle cx="110" cy="90" r="3.5" fill="white" opacity="0.18"/>
  <circle cx="192" cy="148" r="3" fill="white" opacity="0.14"/>
  <circle cx="106" cy="220" r="3" fill="white" opacity="0.15"/>
  <circle cx="190" cy="288" r="3.5" fill="white" opacity="0.13"/>
  <circle cx="118" cy="330" r="2.5" fill="white" opacity="0.12"/>
  <!-- text -->
  <text x="150" y="68" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="#2A6010" text-anchor="middle" letter-spacing="1">TRADER JOE'S</text>
  <text x="150" y="92" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#2A6010" text-anchor="middle" letter-spacing="2">SPARKLING</text>
  <text x="150" y="132" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#1E5008" text-anchor="middle">water-</text>
  <text x="150" y="164" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#1E5008" text-anchor="middle">melon</text>
  <text x="150" y="192" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2A6010" text-anchor="middle" letter-spacing="2">JUICE</text>
  <!-- watermelon slice -->
  <g transform="translate(150,268)">
    <path d="M-28,0 A28,28 0 0,1 28,0 Z" fill="#4A8C20"/>
    <path d="M-22,0 A22,22 0 0,1 22,0 Z" fill="#FF5566"/>
    <path d="M-14,0 A14,14 0 0,1 14,0 Z" fill="#FF8888" opacity="0.5"/>
    <ellipse cx="-9" cy="-7" rx="2" ry="3.5" fill="#1A1A1A" transform="rotate(-15,-9,-7)"/>
    <ellipse cx="1" cy="-12" rx="2" ry="3.5" fill="#1A1A1A" transform="rotate(5,1,-12)"/>
    <ellipse cx="11" cy="-7" rx="2" ry="3.5" fill="#1A1A1A" transform="rotate(15,11,-7)"/>
    <ellipse cx="-18" cy="-3" rx="1.8" ry="3" fill="#1A1A1A" transform="rotate(-25,-18,-3)"/>
    <ellipse cx="19" cy="-3" rx="1.8" ry="3" fill="#1A1A1A" transform="rotate(25,19,-3)"/>
  </g>
  <!-- net weight -->
  <text x="150" y="340" font-family="Georgia, serif" font-size="7.5" fill="#2A6010" text-anchor="middle" letter-spacing="1" opacity="0.9">8.45 FL OZ (250mL)</text>
</g>

<!-- can outline -->
<path d="M94,36 L206,36 L206,368 Q206,382 150,382 Q94,382 94,368 Z" fill="none" stroke="#4A8020" stroke-width="1.5"/>

<!-- neck taper -->
<polygon points="94,36 106,20 194,20 206,36" fill="url(#green-grad)"/>
<polygon points="94,36 106,20 194,20 206,36" fill="none" stroke="#4A8020" stroke-width="1"/>

<!-- lid -->
<ellipse cx="150" cy="20" rx="44" ry="8" fill="url(#silver)" stroke="#888" stroke-width="1"/>
<ellipse cx="150" cy="20" rx="32" ry="5" fill="#D4D4D4" stroke="#AAA" stroke-width="0.5"/>

<!-- bottom -->
<path d="M94,368 Q94,382 150,382 Q206,382 206,368" fill="url(#green-grad)" stroke="#4A8020" stroke-width="1"/>

</svg>
