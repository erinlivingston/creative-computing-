<svg width="360" height="460" viewBox="0 0 360 460" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Water glass with Liquid IV packet illustration</title>
<desc>Clear water glass with ice cubes and a small Liquid IV Lemon Lime packet leaning against it</desc>

<defs>
  <linearGradient id="water-grad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#E8F6FC"/>
    <stop offset="100%" stop-color="#C0E8F8"/>
  </linearGradient>
  <linearGradient id="navy-grad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#1A3A6A"/>
    <stop offset="40%" stop-color="#2258A0"/>
    <stop offset="100%" stop-color="#1A3A6A"/>
  </linearGradient>
  <linearGradient id="teal-grad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#0A8A9A"/>
    <stop offset="40%" stop-color="#14C0D0"/>
    <stop offset="100%" stop-color="#0A8A9A"/>
  </linearGradient>
  <clipPath id="glass-clip">
    <polygon points="72,80 228,80 216,340 84,340"/>
  </clipPath>
  <clipPath id="packet-clip">
    <rect x="0" y="0" width="52" height="200" rx="4"/>
  </clipPath>
</defs>

<!-- water glass -->
<g clip-path="url(#glass-clip)">
  <rect x="70" y="82" width="160" height="260" fill="url(#water-grad)"/>
  <rect x="88" y="90" width="32" height="32" rx="4" fill="white" opacity="0.62" transform="rotate(-8,104,106)"/>
  <rect x="140" y="84" width="28" height="28" rx="4" fill="white" opacity="0.58" transform="rotate(7,154,98)"/>
  <rect x="188" y="92" width="24" height="24" rx="4" fill="white" opacity="0.54" transform="rotate(-5,200,104)"/>
  <rect x="94" y="138" width="28" height="28" rx="4" fill="white" opacity="0.50" transform="rotate(9,108,152)"/>
  <rect x="156" y="132" width="26" height="26" rx="4" fill="white" opacity="0.46" transform="rotate(-6,169,145)"/>
  <rect x="90" y="188" width="26" height="26" rx="4" fill="white" opacity="0.44" transform="rotate(6,103,201)"/>
  <rect x="152" y="194" width="24" height="24" rx="4" fill="white" opacity="0.40" transform="rotate(-9,164,206)"/>
</g>
<polygon points="72,80 84,80 72,340 60,340" fill="white" opacity="0.14"/>
<polygon points="72,80 228,80 216,340 84,340" fill="none" stroke="#88AABB" stroke-width="1.5"/>
<rect x="70" y="72" width="160" height="11" rx="3" fill="#C8E4F0" stroke="#88AABB" stroke-width="1"/>
<ellipse cx="150" cy="340" rx="66" ry="7" fill="#A8CCDC" stroke="#88AABB" stroke-width="1"/>

<!-- liquid IV packet -->
<g transform="translate(196,100) rotate(14)">
  <g clip-path="url(#packet-clip)">
    <rect x="0" y="0" width="52" height="120" fill="url(#navy-grad)"/>
    <rect x="0" y="120" width="52" height="80" fill="url(#teal-grad)"/>
    <rect x="0" y="0" width="6" height="200" fill="white" opacity="0.07"/>
    <rect x="46" y="0" width="6" height="200" fill="black" opacity="0.10"/>
    <path d="M26,10 Q30,18 30,22 A4,4 0 0,1 22,22 Q22,18 26,10 Z" fill="#4AC8E0"/>
    <circle cx="26" cy="22" r="4" fill="#4AC8E0"/>
    <text x="26" y="48" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="0.5">LIQUID</text>
    <text x="26" y="63" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="0.5">I.V.</text>
    <line x1="5" y1="70" x2="47" y2="70" stroke="white" stroke-width="0.7" opacity="0.4"/>
    <text x="26" y="81" font-family="Georgia, serif" font-size="5" fill="white" text-anchor="middle">ELECTROLYTE DRINK MIX</text>
    <rect x="3" y="88" width="46" height="16" rx="2" fill="#F5D020"/>
    <text x="26" y="99" font-family="Georgia, serif" font-size="6.5" font-weight="bold" fill="#1A3A6A" text-anchor="middle">LEMON LIME</text>
    <circle cx="18" cy="154" r="18" fill="#F5D020" opacity="0.85"/>
    <circle cx="18" cy="154" r="14" fill="#F8E060" opacity="0.7"/>
    <line x1="18" y1="136" x2="18" y2="172" stroke="#E8B800" stroke-width="0.8" opacity="0.5"/>
    <line x1="4" y1="145" x2="32" y2="163" stroke="#E8B800" stroke-width="0.8" opacity="0.5"/>
    <line x1="4" y1="163" x2="32" y2="145" stroke="#E8B800" stroke-width="0.8" opacity="0.5"/>
    <path d="M36,136 Q50,142 48,158 Q41,167 33,161 Q29,150 36,136 Z" fill="#5AB030" opacity="0.9"/>
    <path d="M37,140 Q49,145 47,157 Q41,164 34,159 Q31,150 37,140 Z" fill="#7AD040" opacity="0.7"/>
  </g>
  <rect x="0" y="0" width="52" height="200" rx="4" fill="none" stroke="#0A2A5A" stroke-width="1.2"/>
  <rect x="0" y="0" width="52" height="8" rx="3" fill="#0A2A5A" opacity="0.5"/>
  <rect x="0" y="192" width="52" height="8" rx="3" fill="#0A6A7A" opacity="0.5"/>
</g>

<text x="150" y="380" font-family="Georgia, serif" font-size="13" fill="#5f5e5a" text-anchor="middle">water</text>

</svg>
