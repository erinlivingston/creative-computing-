<svg width="300" height="380" viewBox="0 200 300 380" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Gatorade Glacier Freeze bottle illustration</title>
<desc>Classic Gatorade bottle shape, light blue, orange cap, Frost Glacier Freeze label with G logo</desc>

<defs>
  <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#4A9EC0"/>
    <stop offset="22%" stop-color="#78C4E0"/>
    <stop offset="50%" stop-color="#A8DCF0"/>
    <stop offset="78%" stop-color="#78C4E0"/>
    <stop offset="100%" stop-color="#4A9EC0"/>
  </linearGradient>
  <linearGradient id="cap-grad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#C86820"/>
    <stop offset="45%" stop-color="#F0A060"/>
    <stop offset="100%" stop-color="#C86820"/>
  </linearGradient>
  <clipPath id="bottle-clip">
    <path d="M114,548 Q82,546 80,524 L78,318 Q76,302 86,295 L98,290 Q110,285 113,274 Q120,250 150,244 Q180,250 187,274 Q190,285 202,290 L214,295 Q224,302 222,318 L220,524 Q218,546 186,548 Z"/>
  </clipPath>
</defs>

<!-- bottle body clipped -->
<g clip-path="url(#bottle-clip)">
  <path d="M114,548 Q82,546 80,524 L78,318 Q76,302 86,295 L98,290 Q110,285 113,274 Q120,250 150,244 Q180,250 187,274 Q190,285 202,290 L214,295 Q224,302 222,318 L220,524 Q218,546 186,548 Z" fill="url(#body-grad)"/>
  <!-- shadow arcs sides -->
  <path d="M80,450 Q82,385 86,318 Q88,304 78,296" fill="none" stroke="#3A7898" stroke-width="6" stroke-linecap="round" opacity="0.32"/>
  <path d="M220,450 Q218,385 214,318 Q212,304 222,296" fill="none" stroke="#3A7898" stroke-width="6" stroke-linecap="round" opacity="0.32"/>
  <!-- bottom arc -->
  <path d="M86,532 Q150,542 214,532" fill="none" stroke="#3A7898" stroke-width="5" stroke-linecap="round" opacity="0.28"/>
  <!-- shoulder shadows -->
  <path d="M113,276 Q122,256 150,248" fill="none" stroke="#3A7898" stroke-width="3" stroke-linecap="round" opacity="0.28"/>
  <path d="M187,276 Q178,256 150,248" fill="none" stroke="#3A7898" stroke-width="3" stroke-linecap="round" opacity="0.28"/>
  <!-- waist crease -->
  <path d="M78,306 Q150,298 222,306" fill="none" stroke="#3A7898" stroke-width="2.5" stroke-linecap="round" opacity="0.25"/>
  <path d="M78,314 Q150,322 222,314" fill="none" stroke="#3A7898" stroke-width="2" stroke-linecap="round" opacity="0.20"/>
  <!-- highlight -->
  <path d="M84,280 Q78,360 80,460" fill="none" stroke="white" stroke-width="7" stroke-linecap="round" opacity="0.18"/>
  <!-- G label -->
  <rect x="104" y="348" width="92" height="96" rx="8" fill="white" opacity="0.88"/>
  <text x="152" y="425" font-family="Georgia, serif" font-size="76" font-weight="bold" fill="#5AAEC8" text-anchor="middle" opacity="0.95">G</text>
  <polygon points="156,362 147,388 156,384 148,410 164,380 156,385" fill="#F07820" opacity="0.9"/>
  <!-- label text -->
  <text x="150" y="462" font-family="Georgia, serif" font-size="7.5" font-weight="bold" fill="#2A6888" text-anchor="middle" letter-spacing="1.5">GATORADE FROST</text>
  <rect x="108" y="467" width="84" height="13" rx="2" fill="#5AAEC8"/>
  <text x="150" y="477" font-family="Georgia, serif" font-size="7.5" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="0.8">GLACIER FREEZE</text>
</g>

<!-- bottle outline -->
<path d="M114,548 Q82,546 80,524 L78,318 Q76,302 86,295 L98,290 Q110,285 113,274 Q120,250 150,244 Q180,250 187,274 Q190,285 202,290 L214,295 Q224,302 222,318 L220,524 Q218,546 186,548 Z" fill="none" stroke="#4A8AAA" stroke-width="1.5"/>

<!-- cap lower -->
<path d="M113,246 L187,246 L190,254 Q194,263 187,269 L113,269 Q106,263 110,254 Z" fill="url(#cap-grad)" stroke="#B05818" stroke-width="1.2"/>

<!-- cap top -->
<rect x="122" y="228" width="56" height="20" rx="7" fill="url(#cap-grad)" stroke="#B05818" stroke-width="1.2"/>
<line x1="132" y1="230" x2="130" y2="247" stroke="#B05818" stroke-width="0.8" opacity="0.5"/>
<line x1="139" y1="229" x2="138" y2="248" stroke="#B05818" stroke-width="0.8" opacity="0.5"/>
<line x1="146" y1="228" x2="146" y2="248" stroke="#B05818" stroke-width="0.8" opacity="0.5"/>
<line x1="153" y1="228" x2="154" y2="248" stroke="#B05818" stroke-width="0.8" opacity="0.5"/>
<line x1="160" y1="229" x2="162" y2="247" stroke="#B05818" stroke-width="0.8" opacity="0.5"/>
<line x1="167" y1="230" x2="170" y2="247" stroke="#B05818" stroke-width="0.8" opacity="0.5"/>

<!-- base shadow -->
<ellipse cx="150" cy="548" rx="72" ry="7" fill="#4A8AAA" opacity="0.35" stroke="#3A7898" stroke-width="0.5"/>

</svg>
